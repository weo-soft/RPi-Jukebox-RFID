# =============================================================================
# Jukebox Plugin Registry
# =============================================================================
# This file defines all plugins that are presented during installation.
#
# To add a new plugin, add an entry under 'plugins':
#
# plugins:
#   - name: my_plugin                    # Unique name (= modules.others entry)
#     description: "My description"      # Shown in the installer prompt
#     repository: "https://github.com/..." # Git repository URL
#     config_key: my_plugin              # (optional) top-level config key in jukebox.yaml
#
# =============================================================================

plugins:
  - name: example_plugin
    description: "Example Phoniebox Plugin — reference implementation for plugin developers (How-To)"
    repository: "https://github.com/weo-soft/example-phoniebox-plugin"
    config_key: example_plugin